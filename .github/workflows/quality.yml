name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test sentry-cli 3.7.0 compatibility
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/sentry-cli \
            https://github.com/getsentry/sentry-cli/releases/download/3.7.0/sentry-cli-Linux-x86_64
          echo "cec71d46a7cc394c94b6e75f1601985c710d457376c546ef3975567b3671563b  /tmp/sentry-cli" | sha256sum --check
          chmod 0755 /tmp/sentry-cli
          SENTRY_CLI_BIN=/tmp/sentry-cli go test -count=1 -run TestSentryCLIWorkflow -v ./internal/httpapi
      - run: ./scripts/test-libsql.sh

  browser:
    name: Production image browser E2E (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: barktrace
          POSTGRES_PASSWORD: barktrace-test
          POSTGRES_DB: barktrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barktrace -d barktrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/e2e/pnpm-lock.yaml
      - run: pnpm --dir tests/e2e install --frozen-lockfile
      - run: ./scripts/test-e2e.sh
        env:
          BARKTRACE_E2E_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://barktrace:barktrace-test@127.0.0.1:5432/barktrace?sslmode=disable' || '' }}

  load:
    name: Ingestion load and memory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/test-load.sh
        env:
          BARKTRACE_LOAD_DURATION: 30s
