name: Container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep released container public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ADMIN_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN }}
        run: |
          if [ -n "$GHCR_ADMIN_TOKEN" ]; then
            GH_TOKEN="$GHCR_ADMIN_TOKEN"
            export GH_TOKEN
          fi
          if gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public >/dev/null; then
            exit 0
          fi
          if [ -n "$GHCR_ADMIN_TOKEN" ]; then
            echo "::error::GHCR_ADMIN_TOKEN could not make the container package public"
            exit 1
          fi
          echo "::warning::The image was published, but GITHUB_TOKEN cannot change package visibility. Make the package public once in GitHub Packages settings or add a classic GHCR_ADMIN_TOKEN secret with admin:org and write:packages scopes."
